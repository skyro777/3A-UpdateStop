
name: JadxDecompile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Show runner specs
        run: |
          echo "========== RUNNER SPECS =========="
          echo "CPU cores : $(nproc)"
          echo "Memory    : $(free -h | awk '/Mem:/ {print $2}')"
          echo "Disk      : $(df -h / | awk 'NR==2 {print $2}')"
          echo "Hostname  : $(hostname)"
          echo "=================================="

      - name: Checkout APK repository (with LFS)
        uses: actions/checkout@v4
        with:
          repository: skyro777/3A-UpdateStop
          ref: main
          path: apk-repo
          lfs: true

      - name: Verify APK and LFS download
        run: |
          APK="apk-repo/3A CLOUD GAMING UPDATE.apk"

          echo "========== APK VERIFICATION =========="

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          if head -n 1 "$APK" | grep -q "version https://git-lfs.github.com/spec/v1"; then
            echo "ERROR: Git LFS pointer detected instead of actual APK!"
            exit 1
          fi

          echo "APK successfully downloaded."
          ls -lh "$APK"
          file "$APK"

          echo "======================================"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download jadx
        run: |
          curl -sL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile with jadx (memory-safe)
        env:
          JAVA_OPTS: "-Xmx6g -XX:+UseG1GC"
        run: |
          mkdir -p jadx-out

          APK="apk-repo/3A CLOUD GAMING UPDATE.apk"

          THREADS=$(nproc)

          echo "Using $THREADS threads (matching CPU cores)"

          set -o pipefail

          ./jadx/bin/jadx \
            -d jadx-out \
            --no-res \
            --threads-count "$THREADS" \
            --show-bad-code \
            --deobf \
            --deobf-use-sourcename \
            --decompilation-mode restructure \
            --log-level INFO \
            "$APK" 2>&1 | tee jadx.log | tail -50

          echo "=== java file count ==="
          find jadx-out -name "*.java" | wc -l

      - name: Show error summary (expected, not fatal)
        if: always()
        run: |
          echo "=== JADX error count ==="

          if [ -f jadx.log ]; then
            grep -c "ERROR -" jadx.log || true

            echo "=== Unique error methods (first 20) ==="
            grep "ERROR -   Method:" jadx.log | head -20 || true
          else
            echo "jadx.log was not created."
          fi

      - name: Zip decompiled source
        run: |
          echo "Creating zip..."

          zip -r -q 3a-cloud-gaming-update-decompiled.zip jadx-out/

          ls -lh 3a-cloud-gaming-update-decompiled.zip

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: 3a-cloud-gaming-update-decompiled-java
          path: 3a-cloud-gaming-update-decompiled.zip
          retention-days: 14
          if-no-files-found: error
