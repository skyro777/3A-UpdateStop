name: APK Reconnaissance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Show runner specs
        run: |
          echo "========== RUNNER SPECS =========="
          echo "CPU cores : $(nproc)"
          echo "Memory    : $(free -h | awk '/Mem:/ {print $2}')"
          echo "Disk      : $(df -h / | awk 'NR==2 {print $2}')"
          echo "=================================="

      - name: Checkout APK repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          repository: skyro777/3A-UpdateStop
          ref: main
          path: apk-repo
          lfs: true
          persist-credentials: false

      - name: Verify APK and Git LFS download
        shell: bash
        run: |
          set -euo pipefail
          APK="apk-repo/3A CLOUD GAMING UPDATE.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK file is missing: $APK"
            exit 1
          fi

          if head -n 1 "$APK" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "::error::Git LFS pointer found instead of the APK binary."
            exit 1
          fi

          mkdir -p report
          {
            echo "APK path: $APK"
            echo "APK size: $(du -h "$APK" | cut -f1)"
            echo "File type: $(file -b "$APK")"
            echo "SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          } | tee report/input-file.txt

          echo "Checking ZIP/APK integrity..."
          unzip -t "$APK" > report/zip-integrity.txt
          tail -n 2 report/zip-integrity.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Inspect APK structure and metadata
        shell: bash
        run: |
          set -u
          APK="apk-repo/3A CLOUD GAMING UPDATE.apk"
          mkdir -p report

          capture() {
            local output="$1"
            shift
            echo "Collecting: $*"
            if "$@" > "report/${output}.txt" 2>&1; then
              printf "\n[Command completed successfully]\n" >> "report/${output}.txt"
            else
              local status=$?
              printf "\n[Command failed with exit code ${status}]\n" >> "report/${output}.txt"
            fi
          }

          echo "Android SDK command-line tools:" > report/tool-versions.txt
          apkanalyzer --version >> report/tool-versions.txt 2>&1 || true

          capture apk-summary apkanalyzer apk summary "$APK"
          capture apk-file-size apkanalyzer apk file-size "$APK"
          capture apk-features apkanalyzer apk features "$APK"

          capture application-id apkanalyzer manifest application-id "$APK"
          capture version-name apkanalyzer manifest version-name "$APK"
          capture version-code apkanalyzer manifest version-code "$APK"
          capture min-sdk apkanalyzer manifest min-sdk "$APK"
          capture target-sdk apkanalyzer manifest target-sdk "$APK"
          capture debuggable apkanalyzer manifest debuggable "$APK"
          capture permissions apkanalyzer manifest permissions "$APK"

          capture dex-list apkanalyzer dex list "$APK"
          capture dex-method-references apkanalyzer dex references "$APK"
          capture dex-packages-defined apkanalyzer dex packages --defined-only "$APK"

          capture apk-file-list apkanalyzer files list "$APK"
          capture resource-packages apkanalyzer resources packages "$APK"

          if apkanalyzer manifest print "$APK" > report/manifest.xml 2> report/manifest-errors.txt; then
            echo "Manifest XML decoded successfully."
          else
            echo "Manifest XML decoding failed; see report/manifest-errors.txt."
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"

          if [[ -x "$BUILD_TOOLS/aapt" ]]; then
            "$BUILD_TOOLS/aapt" dump badging "$APK" > report/aapt-badging.txt 2>&1 || true
            "$BUILD_TOOLS/aapt" dump permissions "$APK" > report/aapt-permissions.txt 2>&1 || true
          else
            echo "aapt executable not found under $SDK_ROOT/build-tools" > report/aapt-badging.txt
          fi

          if [[ -x "$BUILD_TOOLS/apksigner" ]]; then
            if "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > report/signature.txt 2>&1; then
              echo "APK signature verification completed."
            else
              echo "APK signature verification returned a non-zero status; inspect signature.txt."
            fi
          else
            echo "apksigner executable not found." > report/signature.txt
          fi

      - name: Build readable APK inventory
        shell: bash
        run: |
          set -euo pipefail
          APK="apk-repo/3A CLOUD GAMING UPDATE.apk"

          python3 - "$APK" > report/apk-inventory.txt <<'PY'
          import collections
          import os
          import re
          import struct
          import sys
          import zipfile
          import xml.etree.ElementTree as ET

          apk_path = sys.argv[1]
          report_dir = "report"
          android_ns = "{http://schemas.android.com/apk/res/android}"

          def human_size(value):
              units = ["B", "KB", "MB", "GB", "TB"]
              amount = float(value)
              for unit in units:
                  if amount < 1024 or unit == units[-1]:
                      return f"{amount:.2f} {unit}"
                  amount /= 1024

          with zipfile.ZipFile(apk_path) as apk:
              files = [item for item in apk.infolist() if not item.is_dir()]
              names = [item.filename for item in files]
              name_set = set(names)

              print("APK INVENTORY")
              print("=============")
              print(f"Archive entries (files): {len(files)}")
              print(f"Uncompressed total: {human_size(sum(x.file_size for x in files))}")
              print()

              top_dirs = collections.Counter(
                  (name.split("/", 1)[0] if "/" in name else "[root]")
                  for name in names
              )
              print("TOP-LEVEL CONTENT COUNTS")
              for key, value in top_dirs.most_common():
                  print(f"  {key}: {value}")
              print()

              extensions = collections.Counter(
                  os.path.splitext(name)[1].lower() or "[no extension]"
                  for name in names
              )
              print("FILE EXTENSIONS (most common)")
              for key, value in extensions.most_common(30):
                  print(f"  {key}: {value}")
              print()

              dex_entries = sorted(
                  [item for item in files if re.fullmatch(r"classes(?:\d+)?\.dex", os.path.basename(item.filename))],
                  key=lambda item: (0 if item.filename == "classes.dex" else int(re.search(r"(\d+)", item.filename).group(1)))
              )
              print(f"DEX FILES: {len(dex_entries)}")
              for item in dex_entries:
                  with apk.open(item) as stream:
                      header = stream.read(112)
                  if len(header) >= 112 and header[:4] == b"dex\n":
                      version = header[4:7].decode("ascii", errors="replace")
                      counts = {
                          "strings": struct.unpack_from("<I", header, 56)[0],
                          "types": struct.unpack_from("<I", header, 64)[0],
                          "protos": struct.unpack_from("<I", header, 72)[0],
                          "fields": struct.unpack_from("<I", header, 80)[0],
                          "methods": struct.unpack_from("<I", header, 88)[0],
                          "classes": struct.unpack_from("<I", header, 96)[0],
                      }
                      count_text = ", ".join(f"{k}={v:,}" for k, v in counts.items())
                      print(f"  {item.filename}: {human_size(item.file_size)}, DEX {version}, {count_text}")
                  else:
                      print(f"  {item.filename}: {human_size(item.file_size)}, unrecognized DEX header")
              if not dex_entries:
                  print("  No standard classes*.dex files found.")
              print()

              native_libs = [item for item in files if item.filename.startswith("lib/") and item.filename.endswith(".so")]
              print(f"NATIVE LIBRARIES (.so): {len(native_libs)}")
              by_abi = collections.defaultdict(list)
              for item in native_libs:
                  parts = item.filename.split("/")
                  abi = parts[1] if len(parts) > 2 else "unknown"
                  by_abi[abi].append(item)
              for abi, entries in sorted(by_abi.items()):
                  total = sum(entry.file_size for entry in entries)
                  print(f"  {abi}: {len(entries)} libraries, {human_size(total)}")
                  for entry in sorted(entries, key=lambda x: x.file_size, reverse=True)[:12]:
                      print(f"    {entry.filename} ({human_size(entry.file_size)})")
              if not native_libs:
                  print("  No .so files found.")
              print()

              print("LARGEST APK ENTRIES (top 30)")
              for item in sorted(files, key=lambda x: x.file_size, reverse=True)[:30]:
                  print(f"  {human_size(item.file_size):>10}  {item.filename}")
              print()

              package_text = ""
              package_file = os.path.join(report_dir, "dex-packages-defined.txt")
              if os.path.exists(package_file):
                  with open(package_file, encoding="utf-8", errors="replace") as stream:
                      package_text = stream.read().lower()

              lower_names = [name.lower() for name in names]
              checks = [
                  ("Flutter", any("flutter_assets/" in n for n in lower_names) or any(n.endswith("libflutter.so") for n in lower_names)),
                  ("Unity", any(n.endswith("libunity.so") for n in lower_names) or any("assets/bin/data/" in n for n in lower_names)),
                  ("Unity IL2CPP", any(n.endswith("libil2cpp.so") for n in lower_names) or any("global-metadata.dat" in n for n in lower_names)),
                  ("Unreal Engine", any("libunreal.so" in n for n in lower_names) or any(n.endswith(".pak") for n in lower_names)),
                  ("React Native / Hermes", any(n.endswith("libhermes.so") for n in lower_names) or any("index.android.bundle" in n for n in lower_names) or "com.facebook.react" in package_text),
                  ("Cordova", any("cordova.js" in n for n in lower_names) or any("assets/www/" in n for n in lower_names)),
                  ("Kotlin", "kotlin." in package_text or "kotlin/" in " ".join(lower_names)),
                  ("Kotlin coroutines", "kotlinx.coroutines" in package_text),
                  ("AndroidX", "androidx." in package_text),
                  ("Jetpack Compose", "androidx.compose" in package_text),
                  ("Firebase", "com.google.firebase" in package_text),
                  ("OkHttp", "okhttp3." in package_text),
                  ("Retrofit", "retrofit2." in package_text),
                  ("Google Mobile Ads", "com.google.android.gms.ads" in package_text),
                  ("AppLovin", "com.applovin" in package_text),
              ]
              print("FRAMEWORK / SDK INDICATORS")
              detected = [label for label, found in checks if found]
              if detected:
                  for label in detected:
                      print(f"  Possible indicator: {label}")
              else:
                  print("  No listed framework indicators detected by filename/package scan.")
              print("  Note: these are clues from names, not definitive identification.")
              print()

              class_names = []
              for line in package_text.splitlines():
                  parts = line.split()
                  if len(parts) >= 6 and parts[0] == "c":
                      class_names.append(parts[-1])
              if class_names:
                  short_classes = sum(1 for name in class_names if len(name.rsplit(".", 1)[-1]) <= 2)
                  ratio = short_classes / len(class_names) * 100
                  print("OBFUSCATION HEURISTIC")
                  print(f"  Parsed defined class entries: {len(class_names)}")
                  print(f"  Classes with simple names of 1-2 characters: {short_classes} ({ratio:.1f}%)")
                  print("  This is only a rough indicator; generated and library classes can affect it.")
                  print()

          manifest_path = os.path.join(report_dir, "manifest.xml")
          if os.path.exists(manifest_path) and os.path.getsize(manifest_path) > 0:
              print("MANIFEST COMPONENT SUMMARY")
              try:
                  root = ET.parse(manifest_path).getroot()
                  print(f"  Package: {root.get('package', '(not present)')}")
                  for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
                      elements = root.findall(f"./application/{tag}")
                      print(f"  {tag}: {len(elements)}")
                      for element in elements[:40]:
                          name = element.get(android_ns + "name", "(unnamed)")
                          exported = element.get(android_ns + "exported", "implicit/not specified")
                          print(f"    {name} | exported={exported}")
                          if tag == "activity" and len(elements) > 40:
                              continue
                  print(f"  Application label attribute: {root.find('application').get(android_ns + 'label', '(not present)') if root.find('application') is not None else '(application tag missing)'}")
              except Exception as exc:
                  print(f"  Could not parse decoded manifest XML: {exc}")
              print()

          print("RECONNAISSANCE LIMITS")
          print("  This report inspects APK metadata, the decoded manifest, DEX tables, filenames, and native-library layout.")
          print("  It does not execute the APK and does not reconstruct application source code.")
          print("  Framework indicators and obfuscation estimates are heuristic, not proof.")
          PY

          cat report/apk-inventory.txt

      - name: Create quick summary
        if: always()
        run: |
          {
            echo "# APK Reconnaissance Summary"
            echo
            echo "## Input APK"
            cat report/input-file.txt 2>/dev/null || true
            echo
            echo "## Package / version"
            cat report/apk-summary.txt 2>/dev/null || true
            echo
            echo "## Android SDK levels"
            echo "- min SDK: $(cat report/min-sdk.txt 2>/dev/null | head -1)"
            echo "- target SDK: $(cat report/target-sdk.txt 2>/dev/null | head -1)"
            echo
            echo "## DEX files"
            cat report/dex-list.txt 2>/dev/null || true
            echo
            echo "## DEX method references"
            cat report/dex-method-references.txt 2>/dev/null || true
            echo
            echo "## Permissions"
            cat report/permissions.txt 2>/dev/null || true
            echo
            echo "## APK inventory"
            cat report/apk-inventory.txt 2>/dev/null || true
            echo
            echo "## Signature"
            cat report/signature.txt 2>/dev/null || true
          } > report/README-SUMMARY.md

          if [ -f report/README-SUMMARY.md ]; then
            cat report/README-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK reconnaissance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3a-cloud-gaming-update-apk-reconnaissance
          path: report/
          retention-days: 14
          if-no-files-found: error
